<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="300" viewBox="0 0 1024 300" role="img" aria-labelledby="title desc">
  <title id="title">Chase's AI workshop</title>
  <desc id="desc">A workbench for curious ideas. A small terminal connects idea, model, and human interaction.</desc>
  <defs>
    <pattern id="dots" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#c8d5ce"/></pattern>
  </defs>
  <rect width="1024" height="300" rx="16" fill="#f6f3eb"/>
  <rect x="600" width="424" height="300" rx="16" fill="url(#dots)"/>
  <path d="M48 51h22m-11-11v22" stroke="#d7522a" stroke-width="3" stroke-linecap="round"/>
  <text x="86" y="57" fill="#52676c" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="15" letter-spacing="2">A WORKBENCH FOR CURIOUS IDEAS</text>
  <text x="48" y="135" fill="#182b32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="62" font-weight="750" letter-spacing="-2">Chase's AI</text>
  <text x="48" y="204" fill="#182b32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="62" font-weight="750" letter-spacing="-2">workshop<tspan fill="#d7522a">.</tspan></text>
  <text x="51" y="259" fill="#52676c" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="17">ideas → models → things people use</text>
  <rect x="622" y="61" width="352" height="190" rx="13" fill="#ffffff" stroke="#d4ded9" stroke-width="2"/>
  <path d="M622 98h352" stroke="#d4ded9" stroke-width="2"/>
  <circle cx="644" cy="80" r="4" fill="#d7522a"/>
  <circle cx="660" cy="80" r="4" fill="#52676c" opacity=".6"/>
  <circle cx="676" cy="80" r="4" fill="#008575"/>
  <text x="918" y="85" text-anchor="end" fill="#52676c" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12">workbench</text>
  <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="22">
    <text x="648" y="138" fill="#52676c">01 <tspan fill="#182b32">idea.in()</tspan></text>
    <text x="648" y="181" fill="#52676c">02 <tspan fill="#d7522a">model.run()</tspan></text>
    <text x="648" y="224" fill="#52676c">03 <tspan fill="#008575">human.click()</tspan></text>
  </g>
</svg>
