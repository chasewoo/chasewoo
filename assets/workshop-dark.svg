<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="300" viewBox="0 0 1024 300" role="img" aria-labelledby="title desc">
  <title id="title">Chase's AI workshop</title>
  <desc id="desc">A workbench for curious ideas. A small terminal connects idea, model, and human interaction.</desc>
  <defs>
    <pattern id="dots" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#395553"/></pattern>
  </defs>
  <rect width="1024" height="300" rx="16" fill="#15262b"/>
  <rect x="600" width="424" height="300" rx="16" fill="url(#dots)"/>
  <path d="M48 51h22m-11-11v22" stroke="#ff9069" stroke-width="3" stroke-linecap="round"/>
  <text x="86" y="57" fill="#a1b9b6" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="15" letter-spacing="2">A WORKBENCH FOR CURIOUS IDEAS</text>
  <text x="48" y="135" fill="#f1f3e8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="62" font-weight="750" letter-spacing="-2">Chase's AI</text>
  <text x="48" y="204" fill="#f1f3e8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="62" font-weight="750" letter-spacing="-2">workshop<tspan fill="#ff9069">.</tspan></text>
  <text x="51" y="259" fill="#a1b9b6" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="17">ideas → models → things people use</text>
  <rect x="622" y="61" width="352" height="190" rx="13" fill="#1e3339" stroke="#395255" stroke-width="2"/>
  <path d="M622 98h352" stroke="#395255" stroke-width="2"/>
  <circle cx="644" cy="80" r="4" fill="#ff9069"/>
  <circle cx="660" cy="80" r="4" fill="#a1b9b6" opacity=".6"/>
  <circle cx="676" cy="80" r="4" fill="#78d8ba"/>
  <text x="918" y="85" text-anchor="end" fill="#a1b9b6" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12">workbench</text>
  <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="22">
    <text x="648" y="138" fill="#a1b9b6">01 <tspan fill="#f1f3e8">idea.in()</tspan></text>
    <text x="648" y="181" fill="#a1b9b6">02 <tspan fill="#ff9069">model.run()</tspan></text>
    <text x="648" y="224" fill="#a1b9b6">03 <tspan fill="#78d8ba">human.click()</tspan></text>
  </g>
</svg>
